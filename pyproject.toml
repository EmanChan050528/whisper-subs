[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-subs"
version = "0.1.0"
description = "Subtitle any Japanese video or audio locally: faster-whisper transcription + two-pass Ollama translation to .srt"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# NVIDIA GPU. CTranslate2's wheel omits cuBLAS; this provides it without a
# system CUDA install. Loaded by whisper_subs.gpu.enable_cuda_dlls(). cuDNN is
# not needed: a transcription loads only cublas64_12 and cublasLt64_12, and
# runs in fp16 and int8 with cuDNN absent (docs/benchmarks.md). Saves 1.3 GB.
cuda = ["nvidia-cublas-cu12"]
# The drag-and-drop window. Essentials is the Qt Widgets subset of PySide6.
gui = ["PySide6-Essentials>=6.7"]

[project.scripts]
whisper-subs = "whisper_subs.cli:main"

[project.gui-scripts]
whisper-subs-gui = "whisper_subs.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whisper_subs = ["assets/*.png"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
# Full-width Japanese punctuation (．！？「」) is intentional throughout.
ignore = ["RUF001", "RUF002", "RUF003"]
