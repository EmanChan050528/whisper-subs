[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-subs"
version = "0.0.1"
description = "Subtitle any Japanese video or audio locally: faster-whisper transcription + two-pass Ollama translation to .srt"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# NVIDIA GPU. CTranslate2's wheel omits cuBLAS/cuDNN; these provide them
# without a system CUDA install. Loaded by whisper_subs.gpu.enable_cuda_dlls().
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]

[project.scripts]
whisper-subs = "whisper_subs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
# Full-width Japanese punctuation (．！？「」) is intentional throughout.
ignore = ["RUF001", "RUF002", "RUF003"]
